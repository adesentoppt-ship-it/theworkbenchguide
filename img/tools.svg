<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Basic beginner tools: tape measure, square, clamp, drill and sander">
<rect width="800" height="220" fill="#f6f2ea"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#555" text-anchor="middle">
<g transform="translate(90 95)"><circle r="45" fill="#e8b33c"/><circle r="16" fill="#8a6a1c"/><rect x="30" y="28" width="60" height="12" fill="#f1d27a"/><text y="85">Tape measure</text></g>
<g transform="translate(250 95)"><path d="M-45 -45 h20 v70 h70 v20 h-90z" fill="#9aa3ab"/><text y="85">Square</text></g>
<g transform="translate(400 95)"><path d="M-40 -45 h80 v14 h-66 v62 h66 v14 h-80z" fill="#2f5d8a"/><rect x="20" y="-31" width="8" height="62" fill="#c94f3d"/><text y="85">Clamps</text></g>
<g transform="translate(560 95)"><rect x="-50" y="-30" width="70" height="34" rx="8" fill="#2e7d32"/><rect x="20" y="-20" width="34" height="12" fill="#9aa3ab"/><rect x="-35" y="4" width="26" height="48" rx="6" fill="#1f5a23"/><text y="85">Drill / driver</text></g>
<g transform="translate(710 95)"><ellipse cx="0" cy="20" rx="45" ry="14" fill="#555"/><path d="M-35 18 q0-50 35-50 q35 0 35 50z" fill="#d97b2c"/><text y="85">Sander</text></g>
</g></svg>
