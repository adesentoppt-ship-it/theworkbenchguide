<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="A beginner project path: cutting board, box, shelf, bench">
<rect width="800" height="200" fill="#fffdf9"/>
<line x1="100" y1="80" x2="700" y2="80" stroke="#d9c7a8" stroke-width="4" stroke-dasharray="10 8"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(100 80)"><circle r="44" fill="#f6efe3" stroke="#8a5a2b" stroke-width="3"/><rect x="-24" y="-10" width="48" height="20" rx="5" fill="#c58b4c"/><text y="72" font-size="15" fill="#333">1. Cutting board</text></g>
<g transform="translate(300 80)"><circle r="44" fill="#f6efe3" stroke="#8a5a2b" stroke-width="3"/><rect x="-22" y="-14" width="44" height="30" fill="#c58b4c"/><line x1="-22" y1="-4" x2="22" y2="-4" stroke="#8a5a2b" stroke-width="2"/><text y="72" font-size="15" fill="#333">2. Simple box</text></g>
<g transform="translate(500 80)"><circle r="44" fill="#f6efe3" stroke="#8a5a2b" stroke-width="3"/><rect x="-24" y="-20" width="6" height="40" fill="#8a5a2b"/><rect x="18" y="-20" width="6" height="40" fill="#8a5a2b"/><rect x="-24" y="-6" width="48" height="6" fill="#c58b4c"/><rect x="-24" y="12" width="48" height="6" fill="#c58b4c"/><text y="72" font-size="15" fill="#333">3. Wall shelf</text></g>
<g transform="translate(700 80)"><circle r="44" fill="#f6efe3" stroke="#8a5a2b" stroke-width="3"/><rect x="-26" y="-8" width="52" height="8" fill="#c58b4c"/><rect x="-20" y="0" width="6" height="22" fill="#8a5a2b"/><rect x="14" y="0" width="6" height="22" fill="#8a5a2b"/><text y="72" font-size="15" fill="#333">4. Garden bench</text></g>
</g></svg>
